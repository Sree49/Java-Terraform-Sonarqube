# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

variables:
  imagename: gamebox
  tag: $(Build.BuildId)
  acrName: 'acr12345'


stages:
- stage: Build
  displayName: 'Build Java Project'
  jobs:
    - job:
      displayName: 'Maven Build and Push Artifacts'
      pool:
        name: 'sreenija'
      steps:

      - task: Maven@4
        inputs:
          azureSubscription: 'Azure subscription 1(602df268-75e9-4f25-b0e5-bb36790bd552)'
          mavenPomFile: 'pom.xml'
          publishJUnitResults: true
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: 1.11
          jdkArchitectureOption: x64
          mavenVersionOption: 'Default'
          mavenOptions: '-Xmx3072m'
          mavenAuthenticateFeed: false
          effectivePomSkip: false
          sonarQubeRunAnalysis: false


      - task: CopyFiles@2
        inputs:
          SourceFolder: '$(System.DefaultWorkingDirectory)'
          Contents: '**/target/*.?(war|jar)'
          TargetFolder: '$(build.artifactstagingdirectory)'


      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'

- stage: Provision
  displayName: 'Provision ACR and AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: 'Provision_Infra'
      displayName: 'Provision_Infra'
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Azure subscription 1 (602df268-75e9-4f25-b0e5-bb36790bd552)'
            backendAzureRmResourceGroupName: 'rg'
            backendAzureRmStorageAccountName: 'tfstatefilestore1678'
            backendAzureRmContainerName: 'tfstate-container'
            backendAzureRmKey: 'terraform.tfstate'


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'

        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'Azure subscription 1 (602df268-75e9-4f25-b0e5-bb36790bd552)'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'Azure subscription 1 (602df268-75e9-4f25-b0e5-bb36790bd552)'

- stage: 'Deploy'
  displayName: 'Push image to ACR and Deploy code to Kubernetes'
  dependsOn: Provision
  condition: succeeded()
  jobs:
    - job:
      displayName: 'Build Image'
      pool:
        vmImage: ubuntu-latest
      steps:
      - task: AzureCLI@3
        inputs:
          connectionType: 'azureRM'
          azureSubscription: 'Azure subscription 1 (602df268-75e9-4f25-b0e5-bb36790bd552)'
          scriptType: 'batch'
          scriptLocation: 'inlineScript'
          inlineScript: |
            sudo apt update \
            sudo acr login --name $(acr_name) \
            sudo docker build -t $(acrname).azurecr.io$(imagename):$(tag) .
            sudo docker push $(acrname).azurecr.io$(imagename):$(tag)
    
        

